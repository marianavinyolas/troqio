# Configuracion de pnpm.
#
# ⭐ pnpm 11 dejo de leer el campo "pnpm" de package.json, y elimino
# `onlyBuiltDependencies` a favor de `allowBuilds`.
# Sin allowBuilds, pnpm 11 aborta la instalacion con ERR_PNPM_IGNORED_BUILDS.
#
# Migracion: pnpm dlx codemod run pnpm-v10-to-v11
#
# Nota: electron y better-sqlite3 ya NO tienen script de instalacion.
#  - electron 44 quito su postinstall (medida de seguridad); el binario se
#    descarga de forma perezosa con `pnpm exec install-electron`.
#  - better-sqlite3 13 usa prebuilds N-API (prebuilds/*.node), no node-gyp.
allowBuilds:
  # Unico paquete del arbol con un postinstall real (bundle de Vite).
  esbuild: true
  # Listados por_urls de registro aunque hoy no compilan nada: sobre-listar
  # es inofensivo, omitir uno rompe `pnpm install --frozen-lockfile` en CI.
  better-sqlite3: true
  electron: true
  electron-winstaller: true

# Rutas de node_modules cortas en Windows.
#
# electron-builder pasa a makensis la ruta de sus plantillas NSIS dentro de
# node_modules. pnpm construye nombres larguisimos
# (app-builder-lib@26.15.3_dmg-builder@..._electron-builder-squirrel-windows@...)
# y en Windows esa ruta puede pasar los 260 caracteres del MAX_PATH, makensis
# no encuentra el archivo y aborta con ERR_ELECTRON_BUILDER_CANNOT_EXECUTE.
#
# En pnpm 11 esto NO se lee de .npmrc: solo auth y registry. Va aqui en
# camelCase. Ver https://github.com/electron-userland/electron-builder/issues/8175
virtualStoreDirMaxLength: 80
peersSuffixMaxLength: 20
