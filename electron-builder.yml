appId: ar.troqio.app
productName: Troqio
copyright: Troqio

directories:
  buildResources: build
  output: release

files:
  - out/**/*
  - package.json
  # ⭐ Migraciones de drizzle. Tiene que ir DENTRO del asar: la ruta que usa la
  # app (join(__dirname, '..', '..', 'drizzle')) es la misma en desarrollo y
  # empaquetada, y Electron lee el asar como una carpeta comun.
  # Ver src/main/db/migrar.ts. Sin esto, la app instalada no encuentra el
  # esquema y falla en el primer query con "no such table".
  - drizzle/**/*
  - '!**/*.map'

# ⭐ CRITICO: el binario nativo de better-sqlite3 (.node) debe quedar
# fuera del asar o Windows no podra cargarlo.
asarUnpack:
  - '**/*.node'

mac:
  # better-sqlite3 trae 8 prebuilds, uno por plataforma (16 MB en total).
  # Solo se necesita el de la plataforma destino; el resto pesa, se
  # descarga y no se usa.
  #
  # OJO: electron-builder aplica los patrones negativos como un CONJUNTO.
  # Un `!carpeta/**` seguido de `carpeta/archivo.node` NO lo recupera: el
  # negativo gana siempre. Por eso se excluyen los archivos uno por uno.
  # (Tampoco expande ${os}-${arch}.node dentro de `files`.)
  files:
    - '!node_modules/better-sqlite3/prebuilds/win32-x64.node'
    - '!node_modules/better-sqlite3/prebuilds/win32-arm64.node'
    - '!node_modules/better-sqlite3/prebuilds/linux-x64.node'
    - '!node_modules/better-sqlite3/prebuilds/linux-arm64.node'
    - '!node_modules/better-sqlite3/prebuilds/linuxmusl-x64.node'
    - '!node_modules/better-sqlite3/prebuilds/linuxmusl-arm64.node'

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: Troqio-Setup-${version}.exe
  files:
    # Objetivo real de distribucion: solo Windows x64.
    - '!node_modules/better-sqlite3/prebuilds/darwin-arm64.node'
    - '!node_modules/better-sqlite3/prebuilds/darwin-x64.node'
    - '!node_modules/better-sqlite3/prebuilds/win32-arm64.node'
    - '!node_modules/better-sqlite3/prebuilds/linux-x64.node'
    - '!node_modules/better-sqlite3/prebuilds/linux-arm64.node'
    - '!node_modules/better-sqlite3/prebuilds/linuxmusl-x64.node'
    - '!node_modules/better-sqlite3/prebuilds/linuxmusl-arm64.node'

nsis:
  # Asistente de instalacion real, no instalacion silenciosa de un clic.
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false # ⭐ instalacion por usuario: NO requiere permisos de administrador
  # ⭐ OJO: `language` NO es el idioma de la interfaz. Electron-builder lo usa
  # como LANG de recursos de Windows para VIAddVersionKey, y espera un LANGID
  # numerico, no un codigo ISO. Con `language: es` makensis aborta con
  #   VIAddVersionKey: "/LANG=es" is not a valid language code!
  # 2058 = 0x080A = espanol con ordenacion latina (es-AR).
  language: 2058
  # El idioma de la interfaz del asistente va en installerLanguages, que es
  # otra opcion. es_ES se mapea a la MUI "SpanishInternational".
  #
  # OJO: NO poner multiLanguageInstaller: false. Con esa flag el
  # LangConfigurator de electron-builder hace langs = ["en_US"] e ignora
  # installerLanguages por completo: el asistente salia en ingles.
  installerLanguages:
    - es_ES
  # ⭐ Nunca borrar la base de datos al desinstalar.
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Troqio
