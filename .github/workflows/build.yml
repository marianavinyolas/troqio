name: Build Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # windows-latest ya trae MSVC y Node preinstalado.
    runs-on: windows-latest

    steps:
      # Versiones que ya corren en Node 24. Las v4 de checkout/setup-node
      # apuntan a Node 20, que GitHub marcaba como deprecado.
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # electron 44 elimino su postinstall: el binario se descarga de forma
      # perezosa en el primer require(). Lo hacemos explicito y temprano para
      # que un fallo de red falle rapido y en un paso con nombre claro.
      - name: Descargar binario de Electron
        run: pnpm exec install-electron

      - name: Verificar tipos
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Tests
        run: pnpm test

      - name: Compilar main / preload / renderer
        run: pnpm build

      # En Tailwind v4 una clase inexistente no falla el build: simplemente no
      # genera CSS. Un `rounded-pill` con el token eliminado, o un `w-18` mal
      # calculado, se aplican en silencio y el defecto aparece en el maquete y
      # no en la compilacion.
      - name: Verificar clases del renderer
        run: pnpm verificar:clases

      # better-sqlite3 13 usa prebuilds N-API: el mismo .node sirve para Node y
      # para Electron, asi que NO hace falta recompilar contra el ABI de
      # Electron ni tener MSVC para el modulo nativo.
      #
      # OJO: invocar con `pnpm run`, no con `pnpm exec`. `pnpm exec` resuelve
      # electron-builder por una cadena de directorios mas larga, y sumada a
      # la ruta de las plantillas NSIS dentro de node_modules revienta el
      # MAX_PATH de 260 de Windows: makensis no encuentra el archivo y aborta
      # con ERR_ELECTRON_BUILDER_CANNOT_EXECUTE.
      # Ref: electron-userland/electron-builder#8613
      - name: Empaquetar instalador
        id: package
        shell: bash
        run: |
          set -o pipefail
          pnpm run package:win 2>&1 | tee build.log
        continue-on-error: true
        env:
          # Sin certificado por decision del proyecto.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # Volcar el log del empaquetado como anotacion. Se hace DESPUES del fallo
      # porque electron-builder descarga NSIS durante el empaquetado: antes de
      # ese paso el cache no existe y no hay nada que inspeccionar.
      #
      # Esto existe porque los logs de Actions exigen token (403) incluso en un
      # repo publico, mientras que las anotaciones se leen por API sin token.
      # Asi un fallo de empaquetado se puede diagnosticar sin depender de un
      # login. Fue exactamente asi como se encontro el bug de nsis.language.
      #
      # OJO con `set +e`: GitHub corre bash con -e, y cualquier comando con
      # codigo distinto de 0 aborta el paso. Con `head` al final de una
      # tuberia el escritor toma SIGPIPE, pipefail devuelve 141 y el paso
      # muere ANTES de emitir nada. Por eso ninguna sonda lleva `head`.
      - name: Reportar fallo del empaquetado
        if: steps.package.outcome == 'failure'
        shell: bash
        run: |
          set +e
          set +o pipefail

          # El error de verdad suele estar en la seccion "Error output:".
          echo "::error title=error de makensis::$(sed -n '/Error output:/,/failedTask=/p' build.log | sed 's/[[:space:]]*$//' | tr '\n' '~' | cut -c1-1700)"
          echo "::error title=final del log::$(tail -n 20 build.log | sed 's/[[:space:]]*$//' | tr '\n' '~' | cut -c1-1700)"

          CACHE_DIR="$(cygpath -u "$LOCALAPPDATA")/electron-builder/Cache"
          MK=$(find "$CACHE_DIR" -name 'makensis.exe' 2>/dev/null | head -1)
          {
            echo "makensis: ${MK:-NO ENCONTRADO}"
            if [ -n "$MK" ]; then
              echo "-- /VERSION --"
              "$MK" /VERSION 2>&1
              echo "exit=$?"
            fi
          } > diag.txt 2>&1
          echo "::notice title=makensis::$(tr '\n' '~' < diag.txt | cut -c1-1700)"

          {
            echo '### electron-builder fallo'
            echo '```'
            cat build.log
            echo '```'
            echo '### makensis'
            echo '```'
            cat diag.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Subir instalador
        uses: actions/upload-artifact@v6
        with:
          name: troqio-windows-x64
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
