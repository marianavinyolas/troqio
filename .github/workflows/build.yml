name: Build Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # windows-latest ya trae MSVC y Node preinstalado.
    runs-on: windows-latest

    steps:
      # Versiones que ya corren en Node 24. Las v4 de checkout/setup-node
      # apuntan a Node 20, que GitHub marcaba como deprecado.
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # electron 44 elimino su postinstall: el binario se descarga de forma
      # perezosa en el primer require(). Lo hacemos explicito y temprano para
      # que un fallo de red falle rapido y en un paso con nombre claro.
      - name: Descargar binario de Electron
        run: pnpm exec install-electron

      - name: Verificar tipos
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Tests
        run: pnpm test

      - name: Compilar main / preload / renderer
        run: pnpm build

      # better-sqlite3 13 usa prebuilds N-API: el mismo .node sirve para Node y
      # para Electron, asi que NO hace falta recompilar contra el ABI de
      # Electron ni tener MSVC para el modulo nativo.
      - name: Empaquetar instalador
        id: package
        shell: bash
        run: |
          set -o pipefail
          pnpm exec electron-builder --win --x64 2>&1 | tee build.log
        continue-on-error: true
        env:
          # Sin certificado por decision del proyecto.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # Volcar el log del empaquetado como anotacion. Las anotaciones se leen
      # por API sin token; los logs no. Asi un fallo se puede diagnosticar
      # sin depender de un login.
      - name: Reportar fallo del empaquetado
        if: steps.package.outcome == 'failure'
        shell: bash
        run: |
          {
            echo '### electron-builder fallo'
            echo '```'
            tail -n 200 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=filtrado::$(grep -iE 'error|failed|cannot|enoent|not found|unsupported' build.log | tail -n 25 | tr '\n' ' ' | cut -c1-1800)"
          echo "::error title=final del log::$(tail -n 25 build.log | tr '\n' ' ' | cut -c1-1800)"

      - name: Subir instalador
        uses: actions/upload-artifact@v6
        with:
          name: troqio-windows-x64
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
